<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simple Money</title>
<meta name="description" content="A beginner-friendly money planner. Add what you spend, see what's safe to spend, and get simple tips from your Money Coach.">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Simple Money">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* ============ Design tokens ============ */
:root {
  color-scheme: light;
  --bg: #f5f6f9;
  --surface: #ffffff;
  --surface-2: #f0f2f6;
  --ink: #0f1222;
  --ink-2: #4a5068;
  --muted: #7d8399;
  --line: #e5e7ee;
  --shadow: 0 1px 2px rgba(16,24,40,.04), 0 6px 20px rgba(16,24,40,.06);
  --on-accent: #ffffff;
  --accent: var(--accent-l, #4f46e5);
  --accent-soft: color-mix(in srgb, var(--accent) 11%, var(--surface));
  --accent-text: var(--accent);
  /* status (fixed) */
  --good: #0ca30c; --good-ink: #006300;
  --warn: #fab219; --warn-ink: #8a5a00;
  --bad: #d03b3b;  --bad-ink: #b42323;
  /* chart series (validated: needs / treats / future) */
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s-rest: #dfe2ea;
  --grid: #e8e9ee;
  --radius: 20px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0b0d12; --surface: #151821; --surface-2: #1e222d;
    --ink: #f2f3f7; --ink-2: #b8bdcf; --muted: #80879d; --line: #272c39;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    --on-accent: #0b0d16; --accent: var(--accent-d, #818cf8);
    --good-ink: #3ccf3c; --warn-ink: #fab219; --bad-ink: #f07272;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s-rest: #2c3140; --grid: #252a36;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b0d12; --surface: #151821; --surface-2: #1e222d;
  --ink: #f2f3f7; --ink-2: #b8bdcf; --muted: #80879d; --line: #272c39;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  --on-accent: #0b0d16; --accent: var(--accent-d, #818cf8);
  --good-ink: #3ccf3c; --warn-ink: #fab219; --bad-ink: #f07272;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s-rest: #2c3140; --grid: #252a36;
}

/* ============ Base ============ */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.45 var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent-text); }
h1, h2, h3 { margin: 0; line-height: 1.2; }
h1 { font-size: 1.6rem; letter-spacing: -.02em; }
h2 { font-size: 1.05rem; letter-spacing: -.01em; }
p { margin: 0; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.small { font-size: .875rem; }
.tiny { font-size: .78rem; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; border-radius: 10px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ============ Layout ============ */
.app { max-width: 1180px; margin: 0 auto; display: flex; min-height: 100dvh; }
.side { display: none; }
.main { flex: 1; min-width: 0; padding: 16px 16px calc(110px + env(safe-area-inset-bottom)); }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0 16px; }
.topbar .hello { font-size: 1.45rem; font-weight: 700; letter-spacing: -.02em; }
.stack { display: grid; gap: 14px; }
.grid { display: grid; gap: 14px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }

@media (min-width: 960px) {
  .side {
    display: flex; flex-direction: column; gap: 6px; width: 240px; flex: none;
    padding: 24px 16px; position: sticky; top: 0; height: 100dvh;
  }
  .main { padding: 24px 28px 48px; }
  .bottom-nav { display: none !important; }
  .grid.two { grid-template-columns: 1.15fr 1fr; align-items: start; }
  .topbar .hello { font-size: 1.7rem; }
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.1rem; padding: 4px 10px 18px; letter-spacing: -.02em; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.side-link {
  display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px;
  border: 0; background: none; color: var(--ink-2); font-weight: 600; text-align: left; width: 100%;
}
.side-link:hover { background: var(--surface-2); }
.side-link[aria-current="page"] { background: var(--accent-soft); color: var(--accent-text); }
.side .add-btn { margin: 8px 0 14px; }
.side .grow { flex: 1; }

/* ============ Bottom nav (mobile) ============ */
.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  display: grid; grid-template-columns: repeat(5, 1fr); align-items: end;
}
.nav-btn {
  border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 0; color: var(--muted); font-size: .72rem; font-weight: 600;
}
.nav-btn[aria-current="page"] { color: var(--accent-text); }
.nav-plus {
  width: 56px; height: 56px; border-radius: 18px; margin: -22px auto 2px; border: 0;
  background: var(--accent); color: var(--on-accent); display: grid; place-items: center;
  box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 40%, transparent);
}
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico.sm { width: 18px; height: 18px; }

/* ============ Cards & controls ============ */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.link-btn { border: 0; background: none; color: var(--accent-text); font-weight: 600; font-size: .9rem; padding: 4px 2px; }
.btn {
  border: 0; border-radius: 14px; padding: 13px 18px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--accent); color: var(--on-accent); min-height: 48px;
}
.btn:active { transform: scale(.98); }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.soft { background: var(--accent-soft); color: var(--accent-text); }
.btn.danger { background: color-mix(in srgb, var(--bad) 12%, var(--surface)); color: var(--bad-ink); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.icon-btn { border: 0; background: var(--surface); border: 1px solid var(--line); width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; color: var(--ink-2); }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: .9rem;
  display: inline-flex; align-items: center; gap: 6px; color: var(--ink);
}
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }
label.field { display: grid; gap: 6px; font-weight: 600; font-size: .9rem; }
.input, select.input {
  width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 13px; padding: 12px 14px; min-height: 48px; font-size: 1rem;
}
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
.money-input { position: relative; }
.money-input .sym { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600; pointer-events: none; }
.money-input .input { padding-left: 34px; }
.hint { font-weight: 400; color: var(--muted); font-size: .82rem; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: .78rem; font-weight: 700; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; }
.pill.good { background: color-mix(in srgb, var(--good) 14%, var(--surface)); color: var(--good-ink); }
.pill.warn { background: color-mix(in srgb, var(--warn) 20%, var(--surface)); color: var(--warn-ink); }
.pill.bad  { background: color-mix(in srgb, var(--bad) 14%, var(--surface)); color: var(--bad-ink); }
.divider { height: 1px; background: var(--line); margin: 4px 0; }
.empty { text-align: center; padding: 18px 8px; color: var(--muted); }
.empty .big { font-size: 2rem; display: block; margin-bottom: 6px; }

/* ============ Hero ============ */
.hero { background: var(--accent); color: var(--on-accent); border: 0; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%; background: color-mix(in srgb, currentColor 8%, transparent); }
.hero .label { font-weight: 600; opacity: .85; }
.hero .amount { font-size: 3rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; margin: 6px 0 4px; }
.hero .sub { opacity: .9; }
.hero .status { white-space: nowrap; flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; font-weight: 700; font-size: .85rem; background: color-mix(in srgb, currentColor 16%, transparent); }
.meter { height: 10px; border-radius: 999px; background: color-mix(in srgb, currentColor 22%, transparent); overflow: hidden; margin: 16px 0 8px; }
.meter > i { display: block; height: 100%; border-radius: 999px; background: currentColor; }
.hero .meta { display: flex; justify-content: space-between; font-size: .85rem; opacity: .9; }

/* ============ Lists ============ */
.list { display: grid; }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border: 0; background: none; width: 100%; text-align: left; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.emoji { width: 42px; height: 42px; border-radius: 13px; background: var(--surface-2); display: grid; place-items: center; font-size: 1.3rem; flex: none; }
.item .grow { flex: 1; min-width: 0; }
.item .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .amt { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.amt.in { color: var(--good-ink); }
.day-head { font-size: .8rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 14px 0 2px; display: flex; justify-content: space-between; }

/* ============ Bars ============ */
.bar { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: var(--accent); min-width: 4px; }
.cat-row { display: grid; gap: 6px; padding: 8px 0; }
.stacked { display: flex; gap: 2px; height: 16px; border-radius: 999px; overflow: hidden; margin: 6px 0 14px; }
.stacked > i { display: block; height: 100%; }
.stacked > i:first-child { border-radius: 999px 0 0 999px; }
.stacked > i:last-child { border-radius: 0 999px 999px 0; }
.legend { display: grid; gap: 8px; }
.legend .lg { display: grid; grid-template-columns: 12px 1fr auto auto; align-items: center; gap: 10px; font-size: .9rem; }
.legend .sw { width: 12px; height: 12px; border-radius: 4px; }
.legend .pct { color: var(--muted); min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font: 600 11px var(--font); }
.chart .today-lbl { fill: var(--ink); font-weight: 800; }
.chart .ref-lbl { fill: var(--ink-2); font-weight: 600; }
.tip {
  position: fixed; z-index: 60; pointer-events: none; background: var(--ink); color: var(--bg); padding: 7px 10px; border-radius: 10px;
  font-size: .82rem; font-weight: 600; box-shadow: var(--shadow); opacity: 0; transform: translate(-50%, -6px); transition: opacity .12s; white-space: nowrap;
}
.tip.show { opacity: 1; }

/* ============ Coach ============ */
.coach-card { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; padding: 14px 0; border-bottom: 1px solid var(--line); }
.coach-card:last-child { border-bottom: 0; }
.coach-ico { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 1.35rem; background: var(--surface-2); }
.coach-card.alert .coach-ico { background: color-mix(in srgb, var(--bad) 13%, var(--surface)); }
.coach-card.warn .coach-ico { background: color-mix(in srgb, var(--warn) 22%, var(--surface)); }
.coach-card.good .coach-ico { background: color-mix(in srgb, var(--good) 14%, var(--surface)); }
.coach-card.tip .coach-ico { background: var(--accent-soft); }
.coach-card h3 { font-size: 1rem; margin-bottom: 3px; }
.coach-card p { color: var(--ink-2); font-size: .93rem; }
.coach-card b { color: var(--ink); }
.explain { font-size: 1.05rem; line-height: 1.6; color: var(--ink-2); }
.explain b { color: var(--ink); }
.coach-hero { background: linear-gradient(135deg, var(--accent-soft), var(--surface)); }
.steps { counter-reset: s; display: grid; gap: 10px; }
.step { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
.step::before { counter-increment: s; content: counter(s); width: 30px; height: 30px; border-radius: 10px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 800; font-size: .9rem; }

/* ============ Tiles ============ */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; box-shadow: var(--shadow); min-width: 0; }
.tile .k { font-size: .78rem; color: var(--muted); font-weight: 600; }
.tile .v { font-size: 1.2rem; font-weight: 800; letter-spacing: -.01em; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ============ Goals ============ */
.goal { display: grid; gap: 10px; }
.goal .top { display: flex; align-items: center; gap: 12px; }
.goal .bigpct { font-size: 1.3rem; font-weight: 800; }

/* ============ Sheet ============ */
#sheet[hidden] { display: none; }
#sheet { position: fixed; inset: 0; z-index: 75; }
.scrim { position: absolute; inset: 0; background: rgba(8,10,20,.45); opacity: 0; transition: opacity .2s; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 92dvh; overflow: auto;
  background: var(--surface); border-radius: 24px 24px 0 0; padding: 10px 18px calc(20px + env(safe-area-inset-bottom));
  transform: translateY(100%); transition: transform .24s cubic-bezier(.2,.8,.2,1);
}
.sheet::before { content: ""; display: block; width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto 12px; }
#sheet.open .scrim { opacity: 1; }
#sheet.open .sheet { transform: none; }
@media (min-width: 700px) {
  .sheet { left: 50%; right: auto; bottom: auto; top: 50%; width: 520px; border-radius: 24px; transform: translate(-50%, -46%) scale(.98); opacity: 0; transition: transform .2s, opacity .2s; max-height: 88dvh; padding: 22px 24px; }
  .sheet::before { display: none; }
  #sheet.open .sheet { transform: translate(-50%, -50%); opacity: 1; }
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; padding: 10px; border-radius: 11px; font-weight: 700; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.amount-big { font-size: 2.4rem; font-weight: 800; text-align: center; border: 0; background: none; width: 100%; padding: 6px 0; letter-spacing: -.02em; }
.amount-big:focus { outline: none; }
.amount-wrap { display: flex; align-items: center; justify-content: center; gap: 4px; border-bottom: 2px solid var(--line); margin: 6px 0 16px; }
.amount-wrap:focus-within { border-color: var(--accent); }
.amount-wrap .sym { font-size: 2rem; font-weight: 800; color: var(--muted); }
.cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.cat-btn {
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 16px; padding: 10px 4px; display: grid; justify-items: center; gap: 4px;
  font-size: .72rem; font-weight: 600; color: var(--ink-2); line-height: 1.15; text-align: center; min-height: 78px;
}
.cat-btn .e { font-size: 1.6rem; }
.cat-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-text); }
.form { display: grid; gap: 14px; }
.err { color: var(--bad-ink); font-size: .88rem; font-weight: 600; min-height: 1.2em; }

/* ============ Toast & banner ============ */
.toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); z-index: 70;
  background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 600; opacity: 0; transition: .2s; pointer-events: none; max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (min-width: 960px) { .toast { bottom: 32px; } }
.banner { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--accent-soft); color: var(--ink); margin-bottom: 14px; font-size: .92rem; }
.banner .grow { flex: 1; }

/* ============ Onboarding ============ */
.ob { max-width: 520px; margin: 0 auto; padding: 24px 18px 40px; min-height: 100dvh; display: flex; flex-direction: column; }
.ob .dots { display: flex; gap: 6px; margin: 4px 0 26px; }
.ob .dots i { height: 6px; flex: 1; border-radius: 9px; background: var(--line); }
.ob .dots i.on { background: var(--accent); }
.ob h1 { font-size: 1.9rem; margin-bottom: 8px; }
.ob .lead { color: var(--ink-2); font-size: 1.05rem; margin-bottom: 22px; }
.ob .body { flex: 1; display: grid; gap: 16px; align-content: start; }
.ob .foot { display: grid; gap: 10px; margin-top: 24px; }
.ob .welcome-art { font-size: 4rem; margin: 20px 0 10px; }
.bill-row { display: grid; grid-template-columns: 1fr 110px 84px; gap: 8px; align-items: center; }
.bill-row .nm { font-weight: 600; display: flex; align-items: center; gap: 8px; min-width: 0; }
.big-result { text-align: center; padding: 26px 18px; }
.big-result .amount { font-size: 3.2rem; font-weight: 800; letter-spacing: -.03em; color: var(--accent-text); }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { width: 38px; height: 38px; border-radius: 12px; border: 3px solid transparent; }
.swatch[aria-pressed="true"] { border-color: var(--ink); }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.setting:last-child { border-bottom: 0; }
/* ============ v2: views, calendar, year, debts, limits ============ */
.seg.three { grid-template-columns: repeat(3, 1fr); }
.view-seg { margin-bottom: 14px; }
.cat-line { border: 0; background: none; width: 100%; text-align: left; padding: 9px 0; display: grid; gap: 6px; color: inherit; border-radius: 10px; }
.cat-line:hover { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
.cat-line .pill { justify-self: start; }
.bar > i.over { background: var(--bad); }
.cal-head { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 4px; }
.cal-head span { text-align: center; font-size: .72rem; font-weight: 700; color: var(--muted); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-day {
  min-height: 62px; border-radius: 12px; background: var(--surface-2); border: 1.5px solid transparent; padding: 5px 2px 4px;
  display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .7rem; color: var(--ink); min-width: 0;
}
.cal-day.blank { background: none; pointer-events: none; }
.cal-day.today { border-color: var(--accent); background: var(--accent-soft); }
.cal-day.future .dn { color: var(--muted); }
.cal-day .dn { font-weight: 800; font-size: .85rem; }
.cal-day .mk { font-size: .72rem; line-height: 1; min-height: .8rem; letter-spacing: -1px; }

/* ===================== Helpers ===================== */
const $ = (s, r = document) => r.querySelector(s);

const pad = (n) => String(n).padStart(2, '0');
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = (s) => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };

const startOfWeek = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const dim = (y, m) => new Date(y, m + 1, 0).getDate();
const dayDiff = (a, b) => Math.round((parseD(iso(b)) - parseD(iso(a))) / 864e5);
const num = (v) => { let s = String(v ?? '').trim(); if (s.includes(',') && !s.includes('.')) s = s.replace(',', '.'); const n = parseFloat(s.replace(/[^0-9.\-]/g, '')); return isFinite(n) ? Math.round(n * 100) / 100 : 0; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const WD = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const fmtDay = (s) => parseD(s).toLocaleDateString(locale(), { weekday: 'short', day: 'numeric', month: 'short' });
const fmtMonth = (d) => d.toLocaleDateString(locale(), { month: 'long', year: 'numeric' });
const fmtMonthShort = (d) => d.toLocaleDateString(locale(), { month: 'short', year: 'numeric' });
function locale() { return (CURRENCIES[S.settings.currency] || CURRENCIES.GBP).locale; }
function money(n, round = false) {
  const cur = S.settings.currency || 'GBP';
  let v = Number(n) || 0; if (Math.abs(v) < 0.005) v = 0;
  const whole = Math.abs(v - Math.round(v)) < 0.005;

  return new Intl.NumberFormat(locale(), { style: 'currency', currency: cur, minimumFractionDigits: dp, maximumFractionDigits: dp }).format(round ? Math.round(v) : v);
}

}

/* ===================== State ===================== */
function freshState() {

    v: 1, setupDone: false, demo: false,
    profile: { name: '' },

    income: { amount: 0, freq: 'monthly', nextPayday: '' },
    bills: [], goals: [], tx: [], customCats: [],
    debts: [], debtPlan: { strategy: 'avalanche', extra: 0 }, limits: {},
  };
}
function migrate(o) {
  const b = freshState();
  if (!o || typeof o !== 'object') return b;
  return {
    ...b, ...o,
    profile: { ...b.profile, ...(o.profile || {}) },
    settings: { ...b.settings, ...(o.settings || {}) },
    income: { ...b.income, ...(o.income || {}) },

    debtPlan: { ...b.debtPlan, ...(o.debtPlan || {}) },

}

  try { const raw = localStorage.getItem(STORE_KEY); if (raw) return migrate(JSON.parse(raw)); } catch (e) { /* storage unavailable */ }

}

}

function cats() { return [...CONFIG.categories, ...S.customCats]; }
function catById(id) { return cats().find((c) => c.id === id) || CONFIG.categories.find((c) => c.id === 'other'); }

/* ===================== Money maths ===================== */
function nextPayday(ref = today()) {
  const inc = S.income; if (!inc.nextPayday) return null;
  let d = parseD(inc.nextPayday); let guard = 0;
  const step = FREQ[inc.freq] || FREQ.monthly;
  while (d < ref && guard++ < 500) {
    if (inc.freq === 'monthly') { const day = parseD(inc.nextPayday).getDate(); const y = d.getFullYear(), m = d.getMonth() + 1; d = new Date(y, m, Math.min(day, dim(y, m))); }
    else d = addDays(d, step.days);
  }
  return d;
}

  const day = parseInt(b.day, 10); if (!day) return null;
  let d = new Date(ref.getFullYear(), ref.getMonth(), Math.min(day, dim(ref.getFullYear(), ref.getMonth())));
  if (d < ref) { const y = ref.getFullYear(), m = ref.getMonth() + 1; d = new Date(y, m, Math.min(day, dim(y, m))); }
  return d;
}

  const target = Number(g.target) || 0, saved = goalSaved(g), left = Math.max(0, target - saved), monthly = Number(g.monthly) || 0;
  const done = target > 0 && saved >= target;
  let eta = null;
  if (!done && monthly > 0) { const months = Math.ceil(left / monthly); eta = new Date(ref.getFullYear(), ref.getMonth() + months, 1); }
  let needed = null, onTrack = null;
  if (!done && g.by) {
    const by = parseD(g.by);

    needed = left / months;
    onTrack = monthly >= needed - 0.5;
  }

  if (done) status = 'done'; else if (monthly <= 0) status = 'none'; else if (onTrack === false) status = 'behind'; else status = 'ok';
  return { target, saved, left, monthly, done, eta, needed, onTrack, status, p: target > 0 ? clamp(saved / target, 0, 1) : 0 };

/* ---------- Debts ---------- */
function activeDebts() { return S.debts.filter((d) => (Number(d.balance) || 0) > 0.005); }
function debtMonthly() {
  const a = activeDebts(); if (!a.length) return 0;
  return a.reduce((x, d) => x + Math.min(Number(d.minPay) || 0, Number(d.balance) || 0), 0) + (Number(S.debtPlan.extra) || 0);
}
function debtOrder(strategy = S.debtPlan.strategy) {
  return activeDebts().sort(strategy === 'snowball'
    ? (a, b) => (a.balance - b.balance) || ((b.apr || 0) - (a.apr || 0))
    : (a, b) => ((Number(b.apr) || 0) - (Number(a.apr) || 0)) || (a.balance - b.balance));
}
function debtGrowing(d) { const b = Number(d.balance) || 0; return b > 0 && (Number(d.minPay) || 0) <= b * (Number(d.apr) || 0) / 1200 + 0.005; }
// Month-by-month payoff: interest, minimums, then extra (plus freed-up minimums) to the focus debt.
function simulateDebts(extra = Number(S.debtPlan.extra) || 0, strategy = S.debtPlan.strategy) {
  const ds = debtOrder(strategy).map((d) => ({ id: d.id, bal: Number(d.balance) || 0, r: (Number(d.apr) || 0) / 1200, min: Number(d.minPay) || 0, cleared: false }));
  const clear = {}; let month = 0, interest = 0;
  if (!ds.length) return { months: 0, interest: 0, clear, stuck: false };
  while (ds.some((d) => !d.cleared) && month < 600) {
    month++;
    let pool = extra + ds.filter((d) => d.cleared).reduce((a, d) => a + d.min, 0);
    for (const d of ds) if (!d.cleared) { const i = d.bal * d.r; d.bal += i; interest += i; }
    for (const d of ds) if (!d.cleared) { const pay = Math.min(d.min, d.bal); d.bal -= pay; }
    for (const d of ds) { if (d.cleared || pool <= 0) continue; const pay = Math.min(pool, d.bal); d.bal -= pay; pool -= pay; }
    for (const d of ds) if (!d.cleared && d.bal <= 0.005) { d.cleared = true; clear[d.id] = month; }
  }
  return { months: month, interest, clear, stuck: ds.some((d) => !d.cleared) };
}
const monthsFromNow = (n) => { const t = today(); return new Date(t.getFullYear(), t.getMonth() + n, 1); };

/* ---------- Calendar helpers ---------- */
function paydaysIn(y, m) {
  const inc = S.income; if (!inc.nextPayday) return [];
  const anchor = parseD(inc.nextPayday); const n = dim(y, m);
  if (inc.freq === 'monthly' || !FREQ[inc.freq] || !FREQ[inc.freq].days) return [Math.min(anchor.getDate(), n)];
  const step = FREQ[inc.freq].days;
  let d = addDays(anchor, Math.ceil(dayDiff(anchor, new Date(y, m, 1)) / step) * step); const out = [];
  while (d.getMonth() === m && d.getFullYear() === y) { out.push(d.getDate()); d = addDays(d, step); }

}

function calc(ref = today()) {
  const inc = S.income, f = FREQ[inc.freq] || FREQ.monthly;
  const monthlyIncome = (Number(inc.amount) || 0) * f.perMonth;
  const monthlyBills = S.bills.reduce((a, b) => a + (Number(b.amount) || 0), 0);
  const plannedSaving = S.goals.filter((g) => !goalInfo(g, ref).done).reduce((a, g) => a + (Number(g.monthly) || 0), 0);
  const debtPay = debtMonthly();
  const flexibleMonthly = monthlyIncome - monthlyBills - plannedSaving - debtPay;
  const weekly = flexibleMonthly * 12 / 52;

  const ws = startOfWeek(ref), we = addDays(ws, 6);
  const wsI = iso(ws), weI = iso(we);
  const lws = iso(addDays(ws, -7)), lwe = iso(addDays(ws, -1));
  const msI = iso(new Date(ref.getFullYear(), ref.getMonth(), 1));
  const meI = iso(new Date(ref.getFullYear(), ref.getMonth() + 1, 0));
  const lmsI = iso(new Date(ref.getFullYear(), ref.getMonth() - 1, 1));
  const lmeI = iso(new Date(ref.getFullYear(), ref.getMonth(), 0));
  const refI = iso(ref);

  let spentWeek = 0, inWeek = 0, spentMonth = 0, inMonth = 0, spentLastWeek = 0, spentLastMonth = 0;
  let lastWeekToDate = 0;
  const dayIdx = (ref.getDay() + 6) % 7;
  const lwToDateEnd = iso(addDays(ws, -7 + dayIdx));
  const byCat = {}, countCat = {}, days = [0, 0, 0, 0, 0, 0, 0];
  for (const t of S.tx) {
    const d = t.date, amt = Number(t.amount) || 0;
    if (t.type === 'in') { if (d >= wsI && d <= weI) inWeek += amt; if (d >= msI && d <= meI) inMonth += amt; continue; }
    if (d >= wsI && d <= weI) { spentWeek += amt; days[(parseD(d).getDay() + 6) % 7] += amt; }
    if (d >= lws && d <= lwe) { spentLastWeek += amt; if (d <= lwToDateEnd) lastWeekToDate += amt; }
    if (d >= msI && d <= meI) { spentMonth += amt; byCat[t.cat] = (byCat[t.cat] || 0) + amt; countCat[t.cat] = (countCat[t.cat] || 0) + 1; }
    if (d >= lmsI && d <= lmeI) spentLastMonth += amt;
  }
  const savedMonth = S.goals.reduce((a, g) => a + (g.history || []).filter((h) => h.date >= msI && h.date <= meI).reduce((x, h) => x + (Number(h.amount) || 0), 0), 0);
  const reserved = Math.max(plannedSaving, savedMonth);
  const leftMonth = monthlyIncome + inMonth - monthlyBills - debtPay - reserved - spentMonth;
  const weekBudget = weekly + inWeek;
  const safeWeek = weekBudget - spentWeek;
  const daysLeft = 7 - dayIdx;
  const perDay = Math.max(0, safeWeek) / daysLeft;
  let status = 'good';
  if (weekly <= 0 || safeWeek < 0) status = 'over';
  else if (weekBudget > 0 && spentWeek / weekBudget > (dayIdx + 1) / 7 + 0.15) status = 'careful';

  let needsSpent = 0, wantsSpent = 0;
  for (const [id, v] of Object.entries(byCat)) { if (catById(id).kind === 'need') needsSpent += v; else wantsSpent += v; }
  const daysInMonth = dim(ref.getFullYear(), ref.getMonth());
  const dom = ref.getDate();
  const projectedSpend = dom >= 5 ? (spentMonth / dom) * daysInMonth : Math.max(spentMonth, flexibleMonthly);
  const projectedLeft = monthlyIncome + inMonth - monthlyBills - debtPay - reserved - projectedSpend;
  const lastTx = S.tx.filter((t) => t.date <= refI).sort((a, b) => (a.date < b.date ? 1 : -1))[0];
  let noSpendDays = 0;
  for (let i = 0; i < dayIdx; i++) if (days[i] === 0) noSpendDays++;

  return {
    monthlyIncome, monthlyBills, plannedSaving, debtPay, flexibleMonthly, weekly, weekBudget, spentWeek, inWeek, safeWeek, perDay, daysLeft, dayIdx,
    status, days, spentMonth, inMonth, savedMonth, reserved, leftMonth, byCat, countCat, needsSpent, wantsSpent,
    spentLastWeek, lastWeekToDate, spentLastMonth, projectedSpend, projectedLeft, daysInMonth, dom, lastTx, noSpendDays, ws, we,
  };
}

/* ===================== Money Coach =====================

function coachTips(c = calc()) {
  const T = [];
  const add = (tone, emoji, title, body, rank) => T.push({ tone, emoji, title, body, rank });
  const m = (n) => `<b>${money(n, Math.abs(n) >= 100)}</b>`;
  const ref = today();

  if (!S.setupDone) return T;

  // 1. Money in vs. bills
  if (c.monthlyIncome <= 0) add('tip', '💷', 'Add your income', 'Tell me how much you get paid in Settings, and I can work out what\'s safe to spend.', 100);
  else if (c.monthlyBills >= c.monthlyIncome) add('alert', '🚨', 'Your bills cost more than you earn', `Bills are ${m(c.monthlyBills)} a month but you earn ${m(c.monthlyIncome)}. Look at your biggest bills first. Can any be switched to a cheaper deal?`, 99);
  else if (c.flexibleMonthly <= 0) add('alert', '🚨', 'Your plan doesn\'t leave spending money', `After bills and savings there\'s nothing left for everyday things. Try saving a bit less each month until things settle down.`, 98);

  // 2. This week
  if (c.weekly > 0) {
    if (c.safeWeek < 0) add('alert', '🛑', `You've gone over this week by ${money(-c.safeWeek, true)}`, `No panic. Try a few no-spend days to make it back. Next week starts fresh on Monday.`, 95);
    else if (c.status === 'careful') add('warn', '🐢', 'You\'re spending a bit fast this week', `You've used ${pct(c.spentWeek, c.weekBudget)}% of this week's money in ${c.dayIdx + 1} day${c.dayIdx ? 's' : ''}. Keep to about ${m(c.perDay)} a day to finish the week OK.`, 80);
    else if (c.spentWeek > 0) add('good', '✅', 'On track this week', `You've got ${m(c.safeWeek)} left. That's about ${m(c.perDay)} a day until Sunday.`, 30);
  }

  // 3. Month projection
  if (c.monthlyIncome > 0 && c.dom >= 5 && c.flexibleMonthly > 0) {
    if (c.projectedLeft < 0) add('warn', '📉', 'Heading for a tight month', `If you keep spending like this, you'll be about ${m(-c.projectedLeft)} short by the end of the month. Slowing down to ${m(Math.max(0, (c.flexibleMonthly - c.spentMonth) / Math.max(1, c.daysInMonth - c.dom + 1)))} a day fixes it.`, 85);
    else if (c.projectedLeft > 20) {
      const g = S.goals.find((x) => !goalInfo(x).done);
      add('good', '🌟', 'You\'re on course for a good month', `You should have about ${m(c.projectedLeft)} spare at the end of the month.${g ? ` Pop some into ${esc(g.emoji || '')} ${esc(g.name)} when it lands?` : ''}`, 35);
    }
  }

  // 4. Biggest "treat" leak
  const wants = Object.entries(c.byCat).filter(([id]) => catById(id).kind === 'want').sort((a, b) => b[1] - a[1]);
  if (wants.length && c.spentMonth > 0) {
    const [id, amt] = wants[0]; const cat = catById(id); const share = amt / c.spentMonth;
    if (share >= 0.2 && amt >= 25) {
      const cut = amt / 3;
      add('tip', cat.emoji, `${cat.name} is your biggest treat`, `${m(amt)} so far this month (${Math.round(share * 100)}% of your spending). Spending a third less would save about ${m(cut * (c.daysInMonth / Math.max(1, c.dom)))} a month. That's ${m(cut * (c.daysInMonth / Math.max(1, c.dom)) * 12)} a year!`, 70);
    }
  }

  // 5. Little things add up
  const smallCats = ['coffee', 'eatingout'];
  for (const id of smallCats) {
    const n = c.countCat[id] || 0, amt = c.byCat[id] || 0;
    if (n >= 8 && amt > 0) {
      const cat = catById(id);
      add('tip', '🧮', 'Little things add up', `${n} ${cat.name.toLowerCase()} buys this month came to ${m(amt)}. Keep that up all year and it's about ${m(amt / Math.max(1, c.dom) * 365)}.`, 60);
      break;
    }
  }

  // 6. Goals
  for (const g of S.goals) {
    const gi = goalInfo(g);
    const name = `${esc(g.emoji || '🎯')} ${esc(g.name)}`;
    if (gi.done) add('good', '🎉', `You did it: ${esc(g.name)}!`, `You've saved the full ${m(gi.target)}. Amazing work. Time to pick your next goal?`, 50);
    else if (gi.monthly <= 0) add('tip', '🎯', `Give ${esc(g.name)} a monthly amount`, `Even ${m(Math.max(5, Math.round(gi.left / 12)))} a month gets you to ${name} within a year.`, 55);
    else if (gi.status === 'behind') add('warn', '⏰', `${esc(g.name)} is running late`, `At ${m(gi.monthly)} a month you'll get there in ${esc(fmtMonthShort(gi.eta))}, after your date of ${esc(fmtMonthShort(parseD(g.by)))}. Saving ${m(gi.needed - gi.monthly)} more a month gets you back on track.`, 75);
    else if (gi.eta) add('good', '🎯', `${esc(g.name)} is on track`, `At ${m(gi.monthly)} a month you'll have ${m(gi.target)} by ${esc(fmtMonthShort(gi.eta))}.`, 25);
  }

  // 6b. Debts
  if (activeDebts().length) {
    const sim = simulateDebts();
    for (const d of activeDebts()) if (debtGrowing(d)) add('alert', '📈', `${esc(d.name)} is growing, not shrinking`, `The minimum payment (${m(Number(d.minPay) || 0)}) is less than the interest it adds each month (about ${m((Number(d.balance) || 0) * (Number(d.apr) || 0) / 1200)}). Pay a bit more, or ask about a 0% balance transfer.`, 97);
    if (!sim.stuck) add('good', '🏁', `Debt-free by ${esc(fmtMonth(monthsFromNow(sim.months)))}`, `Stick to the plan and every debt is gone in ${sim.months} month${sim.months === 1 ? '' : 's'}.`, 33);
    const extra = Number(S.debtPlan.extra) || 0;
    if (!sim.stuck && c.flexibleMonthly > 60) {
      const more = simulateDebts(extra + 25);
      const saveM = sim.months - more.months, saveI = sim.interest - more.interest;
      if (saveM >= 1 && saveI >= 5) add('tip', '💪', `${money(25, true)} more a month on debts`, `It would make you debt-free ${saveM} month${saveM === 1 ? '' : 's'} sooner and save about ${m(saveI)} in interest. Change it in Goals → Debts.`, 57);
    }
    const focus = debtOrder()[0];
    if (focus && (Number(focus.apr) || 0) >= 15 && S.debtPlan.strategy !== 'avalanche') add('tip', '🔥', `${esc(focus.name)} charges ${Number(focus.apr)}% interest`, 'Paying the highest-interest debt first saves the most money. Switch to "Save the most" in Goals → Debts.', 47);
  }

  // 6c. Category limits
  const lim = S.limits || {}; let limTotal = 0;
  for (const [id, raw] of Object.entries(lim)) {
    const L = Number(raw) || 0; if (L <= 0) continue; limTotal += L;
    const sp = c.byCat[id] || 0, cat = catById(id), dl = c.daysInMonth - c.dom + 1;
    if (sp > L) add('warn', cat.emoji, `Over your ${esc(cat.name.toLowerCase())} limit`, `${m(sp)} spent of your ${m(L)} limit. Try to spend nothing more here until next month.`, 82);
    else if (sp >= L * 0.8) add('warn', cat.emoji, `${esc(cat.name)} limit nearly used`, `Only ${m(L - sp)} left for the next ${dl} day${dl === 1 ? '' : 's'}. That's about ${m((L - sp) / dl)} a day.`, 78);
  }
  if (limTotal > c.flexibleMonthly && c.flexibleMonthly > 0) add('tip', '🧩', 'Your limits add up to more than you have', `Your category limits total ${m(limTotal)} but you only have ${m(c.flexibleMonthly)} a month for everyday things. Lower one or two.`, 56);

  // 7. Needs / treats / future check (simple 50/30/20)
  if (c.monthlyIncome > 0) {
    const needsPct = (c.monthlyBills / c.monthlyIncome) * 100;
    const savePct = (c.plannedSaving / c.monthlyIncome) * 100;
    if (needsPct > 60 && c.monthlyBills < c.monthlyIncome) add('tip', '🏠', 'Bills take a big bite', `Your bills use ${Math.round(needsPct)}% of your pay. A common guide is about half. Energy, phone and insurance are often cheaper if you shop around when your deal ends.`, 58);
    if (savePct < 10 && c.flexibleMonthly > 0) add('tip', '🌱', 'Try to save 1 in every 10', `Saving 10% of your pay would be ${m(c.monthlyIncome * 0.1)} a month. Start smaller if you need to. Any amount builds the habit.`, 45);
  }

  // 8. Rainy-day fund
  const hasRainy = S.goals.some((g) => /rain|emergenc|safety|buffer/i.test(g.name || ''));
  if (!hasRainy && c.monthlyIncome > 0) add('tip', '🛟', 'Start a rainy-day fund', `Life throws surprises (broken phone, car repair). Aim for one month of bills: ${m(c.monthlyBills || c.monthlyIncome / 2)}. Add it as a goal.`, 40);

  // 9. Subscriptions
  const subs = S.bills.filter((b) => /netflix|spotify|disney|prime|amazon|apple|youtube|now tv|gym|xbox|playstation|paramount|audible|icloud/i.test(b.name || ''));
  if (subs.length >= 3) add('tip', '📺', `You have ${subs.length} subscriptions`, `Together they cost ${m(subs.reduce((a, b) => a + (Number(b.amount) || 0), 0))} a month. Is there one you've not used lately? Cancelling it is free money.`, 52);

  // 10. Coming up soon
  const pd = nextPayday(ref);
  if (pd) { const n = dayDiff(ref, pd); if (n >= 0 && n <= 3) add('good', '💰', n === 0 ? 'It\'s payday!' : `Payday in ${n} day${n === 1 ? '' : 's'}`, n === 0 ? 'Nice. Move your savings first, before you spend anything.' : 'Hang in there. Move your savings as soon as it lands.', 65); }
  for (const b of S.bills) {
    const due = billNextDue(b, ref); if (!due) continue; const n = dayDiff(ref, due);
    if (n >= 0 && n <= 2) add('tip', b.emoji || '🧾', `${esc(b.name)} is due ${n === 0 ? 'today' : n === 1 ? 'tomorrow' : 'in 2 days'}`, `${m(Number(b.amount) || 0)} will go out. Make sure it's in your account.`, 62);
  }

  // 11. Compared with last week
  if (c.dayIdx >= 2 && c.lastWeekToDate > 0) {
    const diff = c.lastWeekToDate - c.spentWeek;
    if (diff >= 10) add('good', '👏', `${money(diff, true)} less than last week`, `So far you've spent less than at this point last week. Keep it going!`, 40);
    else if (-diff >= 20 && c.spentWeek > c.lastWeekToDate * 1.25) add('warn', '📈', 'Spending more than last week', `You've spent ${m(-diff)} more than at this point last week.`, 68);
  }

  // 12. No-spend days
  if (c.noSpendDays >= 2) add('good', '🙌', `${c.noSpendDays} no-spend days this week`, 'Every no-spend day is money kept. Nice one.', 28);

  // 13. Haven't logged lately
  if (c.lastTx) { const n = dayDiff(parseD(c.lastTx.date), ref); if (n >= 3) add('tip', '✍️', 'Quick catch-up?', `Nothing added for ${n} days. Take 1 minute to add anything you've bought so your numbers stay right.`, 72); }
  else add('tip', '✍️', 'Add your first spend', 'Tap the + button whenever you buy something. It takes 3 seconds and I\'ll do the rest.', 90);

  const order = { alert: 0, warn: 1, tip: 2, good: 3 };
  return T.sort((a, b) => (order[a.tone] - order[b.tone]) || (b.rank - a.rank));
}

function explainMoney(c = calc()) {
  const m = (n) => `<b>${money(n, true)}</b>`;
  if (c.monthlyIncome <= 0) return 'Add your income in Settings and I\'ll explain where your money goes.';
  const parts = [];
  parts.push(`Each month you get about ${m(c.monthlyIncome)}.`);
  const billPct = pct(c.monthlyBills, c.monthlyIncome);
  const billWord = billPct >= 70 ? 'most of it' : billPct >= 45 ? 'about half' : billPct >= 25 ? 'about a quarter' : 'a small part';
  parts.push(`Your bills take ${m(c.monthlyBills)}, which is ${billWord} (${billPct}%).`);
  if (c.debtPay > 0) parts.push(`You pay ${m(c.debtPay)} a month towards your debts.`);
  if (c.plannedSaving > 0) parts.push(`You're putting ${m(c.plannedSaving)} away for your goals.`);
  if (c.flexibleMonthly > 0) parts.push(`That leaves ${m(c.flexibleMonthly)} for everyday things, about ${m(c.weekly)} a week.`);
  else parts.push(`That leaves nothing for everyday things, so something needs to change.`);
  const top = Object.entries(c.byCat).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([id]) => `${catById(id).emoji} ${esc(catById(id).name)}`);
  if (c.spentMonth > 0) parts.push(`So far this month you've spent ${m(c.spentMonth)}${top.length ? `, mostly on ${top.join(' and ')}` : ''}.`);
  if (c.dom >= 5 && c.flexibleMonthly > 0) {
    parts.push(c.projectedLeft >= 0 ? `If you keep going like this, you'll have about ${m(c.projectedLeft)} spare at the end of the month. 🎉` : `If you keep going like this, you'll be about ${m(-c.projectedLeft)} short at the end of the month.`);
  }
  return parts.join(' ');
}

/* ===================== Theme ===================== */
function applyTheme() {
  const r = document.documentElement;
  if (S.settings.theme === 'auto') delete r.dataset.theme; else r.dataset.theme = S.settings.theme;
  const a = ACCENTS[S.settings.accent] || ACCENTS.indigo;
  r.style.setProperty('--accent-l', a.l); r.style.setProperty('--accent-d', a.d);
  const dark = S.settings.theme === 'dark' || (S.settings.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  const meta = $('meta[name="theme-color"]'); if (meta) meta.content = dark ? '#0b0d12' : a.l;
}

/* ===================== Rendering ===================== */
const root = $('#root');
function render() {
  applyTheme();
  if (!S.setupDone) { renderOnboarding(); return; }
  const tabs = [['home', 'Home', 'home'], ['spending', 'Spending', 'chart'], ['goals', 'Goals', 'target'], ['coach', 'Coach', 'spark']];
  const nav = (id) => (UI.tab === id ? 'aria-current="page"' : '');
  const views = { home: viewHome, spending: viewSpending, goals: viewGoals, coach: viewCoach, settings: viewSettings };
  root.innerHTML = `
  <div class="app">
    <nav class="side" aria-label="Main">
      <div class="brand"><span class="brand-mark">${icon('spark')}</span>${esc(CONFIG.appName)}</div>
      <button class="btn block add-btn" data-act="add">${icon('plus')} Add spending</button>
      ${tabs.map(([id, label, ic]) => `<button class="side-link" data-act="tab" data-tab="${id}" ${nav(id)}>${icon(ic)}${label}</button>`).join('')}
      <div class="grow"></div>
      <button class="side-link" data-act="tab" data-tab="settings" ${nav('settings')}>${icon('gear')}Settings</button>
    </nav>
    <main class="main" id="main">${(views[UI.tab] || viewHome)()}</main>
  </div>
  <nav class="bottom-nav" aria-label="Main">
    <button class="nav-btn" data-act="tab" data-tab="home" ${nav('home')}>${icon('home')}Home</button>
    <button class="nav-btn" data-act="tab" data-tab="spending" ${nav('spending')}>${icon('chart')}Spending</button>
    <div><button class="nav-plus" data-act="add" aria-label="Add spending">${icon('plus')}</button></div>
    <button class="nav-btn" data-act="tab" data-tab="goals" ${nav('goals')}>${icon('target')}Goals</button>
    <button class="nav-btn" data-act="tab" data-tab="coach" ${nav('coach')}>${icon('spark')}Coach</button>
  </nav>`;
}

function topbar(title, sub = '') {
  return `<header class="topbar">
    <div><div class="hello">${title}</div>${sub ? `<div class="muted small">${sub}</div>` : ''}</div>
    <button class="icon-btn" data-act="tab" data-tab="settings" aria-label="Settings" title="Settings">${icon('gear')}</button>
  </header>${S.demo ? `<div class="banner"><span>👀</span><span class="grow">You're looking at <b>example data</b>. Have a play!</span><button class="btn soft" style="min-height:38px;padding:8px 12px" data-act="start-fresh">Start mine</button></div>` : ''}`;
}

function greeting() {
  const h = new Date().getHours();
  const g = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
  return S.profile.name ? `${g}, ${esc(S.profile.name)} 👋` : `${g} 👋`;
}

function statusPill(st) {
  if (st === 'over') return `<span class="status">⚠️ Over budget</span>`;
  if (st === 'careful') return `<span class="status">🐢 Go steady</span>`;
  return `<span class="status">✓ On track</span>`;
}

function viewHome() {
  const c = calc();
  const tips = coachTips(c);
  const used = c.weekBudget > 0 ? clamp(c.spentWeek / c.weekBudget, 0, 1) : 1;

  const heroAmt = c.safeWeek >= 0 ? money(c.safeWeek) : money(-c.safeWeek);
  const heroLabel = c.safeWeek >= 0 ? 'Safe to spend this week' : 'Over this week\'s budget by';
  const heroSub = c.weekly <= 0 ? 'Your bills and savings use up all your pay. Check Coach for help.'
    : c.safeWeek >= 0 ? (c.daysLeft === 1 ? 'That\'s what\'s left for today. A new week starts tomorrow.' : `About <b>${money(c.perDay)}</b> a day until Sunday`) : 'Try a few no-spend days. A new week starts Monday.';
  return `
  ${topbar(greeting(), esc(today().toLocaleDateString(locale(), { weekday: 'long', day: 'numeric', month: 'long' })))}
  <div class="grid two">
    <div class="stack">
      <section class="card hero" aria-label="Safe to spend">
        <div class="row between"><span class="label">${heroLabel}</span>${statusPill(c.status)}</div>
        <div class="amount num">${heroAmt}</div>
        <div class="sub">${heroSub}</div>
        <div class="meter" role="img" aria-label="${pct(c.spentWeek, c.weekBudget)}% of this week's money used"><i style="width:${(used * 100).toFixed(1)}%"></i></div>
        <div class="meta"><span>Spent ${money(c.spentWeek)}</span><span>Week budget ${money(c.weekBudget, true)}</span></div>
      </section>
      ${tips.length ? `<section class="card">
        <div class="card-head"><h2>💬 Money Coach</h2><button class="link-btn" data-act="tab" data-tab="coach">See all</button></div>
        ${coachItem(tips[0])}
        <button class="btn soft block" data-act="tab" data-tab="coach" style="margin-top:6px">${icon('spark')} Explain my money</button>
      </section>` : ''}
      ${weekChartCard(c)}
    </div>
    <div class="stack">
      ${monthCard(c)}
      ${comingUpCard()}
      ${goalsMiniCard()}
      ${recentCard()}
    </div>
  </div>`;
}

function coachItem(t) {
  return `<div class="coach-card ${t.tone}"><div class="coach-ico" aria-hidden="true">${t.emoji}</div><div><h3>${t.title}</h3><p>${t.body}</p></div></div>`;
}

function weekChartCard(c) {
  const W = 320, H = 150, top = 18, bottom = 24, plotH = H - top - bottom;
  const daily = c.weekly / 7;
  const max = Math.max(daily * 1.25, ...c.days, 1);
  const colW = W / 7, barW = Math.min(26, colW - 14);
  const y = (v) => top + plotH - (v / max) * plotH;
  let bars = '';
  c.days.forEach((v, i) => {
    const x = i * colW + (colW - barW) / 2;
    const h = (v / max) * plotH;
    const day = addDays(c.ws, i);
    const label = `${WD[i]} ${day.getDate()}: ${v > 0 ? money(v) : 'nothing spent'}`;
    if (v > 0) {
      const r = Math.min(4, h / 2);
      bars += `<path d="M${x},${top + plotH} V${top + plotH - h + r} Q${x},${top + plotH - h} ${x + r},${top + plotH - h} H${x + barW - r} Q${x + barW},${top + plotH - h} ${x + barW},${top + plotH - h + r} V${top + plotH} Z" fill="var(--accent)" ${i > c.dayIdx ? 'opacity=".35"' : ''}/>`;
    }
    bars += `<rect x="${i * colW}" y="${top}" width="${colW}" height="${plotH + bottom}" fill="transparent" data-tip="${esc(label)}" tabindex="0" aria-label="${esc(label)}"/>`;
    bars += `<text x="${i * colW + colW / 2}" y="${H - 6}" text-anchor="middle" class="${i === c.dayIdx ? 'today-lbl' : ''}">${WD[i]}</text>`;
  });
  const refLine = daily > 0 ? `<line x1="0" x2="${W}" y1="${y(daily)}" y2="${y(daily)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>` : '';
  return `<section class="card chart">
    <div class="card-head"><h2>This week</h2>${daily > 0 ? `<span class="muted small row" style="gap:6px;white-space:nowrap"><svg width="18" height="4" aria-hidden="true"><line x1="0" x2="18" y1="2" y2="2" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"/></svg>Daily budget ${money(daily, true)}</span>` : ''}</div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Spending each day this week">
      <line x1="0" x2="${W}" y1="${top + plotH}" y2="${top + plotH}" stroke="var(--grid)" stroke-width="1"/>
      ${refLine}${bars}
    </svg>
  </section>`;
}

function monthCard(c) {
  const inc = c.monthlyIncome + c.inMonth;
  const needs = c.monthlyBills + c.debtPay + c.needsSpent, treats = c.wantsSpent, future = c.reserved;
  const left = Math.max(0, inc - needs - treats - future);
  const total = Math.max(inc, needs + treats + future, 1);
  const seg = (v, col, name) => v > 0 ? `<i style="width:${(v / total * 100).toFixed(2)}%;background:${col}" data-tip="${esc(name)}: ${esc(money(v, true))}"></i>` : '';
  const row = (col, name, v, hint) => `<div class="lg"><span class="sw" style="background:${col}"></span><span>${name} <span class="muted tiny">${hint}</span></span><b class="num">${money(v, true)}</b><span class="pct">${pct(v, inc)}%</span></div>`;
  const now = today();
  return `<section class="card">
    <div class="card-head"><h2>${esc(fmtMonth(now))} so far</h2><span class="pill">${money(inc, true)} in</span></div>
    <div class="stacked" role="img" aria-label="How this month's money is split">${seg(needs, 'var(--s1)', 'Needs')}${seg(treats, 'var(--s2)', 'Treats')}${seg(future, 'var(--s3)', 'Future you')}${seg(left, 'var(--s-rest)', 'Not used yet')}</div>
    <div class="legend">
      ${row('var(--s1)', 'Needs', needs, c.debtPay ? 'bills, debts + essentials' : 'bills + essentials')}
      ${row('var(--s2)', 'Treats', treats, 'nice-to-haves')}
      ${row('var(--s3)', 'Future you', future, 'savings')}
      ${row('var(--s-rest)', 'Not used yet', left, '')}
    </div>
  </section>`;
}

function upcoming(daysAhead = 14) {
  const ref = today(), ev = [];
  for (const b of S.bills) { const d = billNextDue(b, ref); if (d && dayDiff(ref, d) <= daysAhead) ev.push({ d, emoji: b.emoji || '🧾', name: b.name, amount: -(Number(b.amount) || 0) }); }
  const pd = nextPayday(ref);
  if (pd && dayDiff(ref, pd) <= daysAhead) ev.push({ d: pd, emoji: '💰', name: 'Payday', amount: Number(S.income.amount) || 0 });
  return ev.sort((a, b) => a.d - b.d);
}
function whenText(d) { const n = dayDiff(today(), d); return n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : `In ${n} days · ${d.toLocaleDateString(locale(), { weekday: 'short', day: 'numeric' })}`; }

function comingUpCard() {
  const ev = upcoming().slice(0, 4);
  return `<section class="card">
    <div class="card-head"><h2>Coming up</h2><button class="link-btn" data-act="tab" data-tab="settings">Edit bills</button></div>

function viewSpendMonth() {

  const ms = iso(md), me = iso(new Date(md.getFullYear(), md.getMonth() + 1, 0));

/* ---------- Where it went (with limits) ---------- */
function whereItWent(by, spent, md) {
  const now = today();
  const isCur = md.getMonth() === now.getMonth() && md.getFullYear() === now.getFullYear();
  const lim = S.limits || {};
  const ids = new Set([...Object.keys(by), ...Object.keys(lim).filter((k) => Number(lim[k]) > 0)]);
  const rows = [...ids].map((id) => [id, by[id] || 0]).sort((a, b) => b[1] - a[1]);
  const maxFree = Math.max(1, ...rows.filter(([id]) => !(Number(lim[id]) > 0)).map(([, v]) => v));
  const html = rows.map(([id, v]) => {
    const c = catById(id), L = Number(lim[id]) || 0;
    let right, bar, pill = '';
    if (L > 0) {
      const p = v / L;
      bar = `<div class="bar"><i class="${p > 1 ? 'over' : ''}" style="width:${clamp(p * 100, 0, 100).toFixed(1)}%"></i></div>`;
      right = `<b>${money(v)}</b> <span class="muted small">of ${money(L, true)}</span>`;
      if (p > 1) pill = `<span class="pill bad">⚠ Over by ${money(v - L, true)}</span>`;
      else if (isCur && p >= 0.8) pill = `<span class="pill warn">⏳ ${money(L - v, true)} left</span>`;
      else if (isCur) pill = `<span class="pill good">✓ ${money(L - v, true)} left</span>`;
      else pill = `<span class="pill good">✓ Under by ${money(L - v, true)}</span>`;
    } else {
      bar = `<div class="bar"><i style="width:${(v / maxFree * 100).toFixed(1)}%"></i></div>`;
      right = `<b>${money(v)}</b> <span class="muted small">${pct(v, spent)}%</span>`;
    }
    return `<button class="cat-line" data-act="limit" data-v="${esc(id)}" aria-label="${esc(c.name)}: ${esc(money(v))}${L ? ` of ${esc(money(L))} limit` : ''}. Tap to set a limit.">
      <div class="row between"><span><span aria-hidden="true">${c.emoji}</span> ${esc(c.name)}</span><span class="num">${right}</span></div>${bar}${pill}</button>`;
  }).join('');
  return `<section class="card">
    <div class="card-head"><h2>Where it went</h2><button class="link-btn" data-act="limit-pick">Set limits</button></div>
    <p class="hint-line">Tap a category to give it a monthly limit.</p>
    ${rows.length ? html : `<div class="empty"><span class="big">🌱</span>Nothing spent this month yet.</div>`}
  </section>`;
}

/* ---------- Calendar ---------- */
function viewCalendar() {
  const now = today(); const md = new Date(now.getFullYear(), now.getMonth() + UI.calOffset, 1);
  const y = md.getFullYear(), m = md.getMonth(), n = dim(y, m), lead = (md.getDay() + 6) % 7;
  const ms = iso(md), me = iso(new Date(y, m + 1, 0)), todayI = iso(now);
  const spentBy = {}, inBy = {};
  for (const t of S.tx) { if (t.date < ms || t.date > me) continue; const a = Number(t.amount) || 0; if (t.type === 'in') inBy[t.date] = (inBy[t.date] || 0) + a; else spentBy[t.date] = (spentBy[t.date] || 0) + a; }
  const pays = paydaysIn(y, m);
  const daily = calc().weekly / 7;
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<span class="cal-day blank"></span>';
  for (let d = 1; d <= n; d++) {
    const di = iso(new Date(y, m, d)); const sp = spentBy[di] || 0; const bl = billsOnDay(y, m, d);
    const marks = (pays.includes(d) ? '💰' : '') + bl.slice(0, 2).map((b) => esc(b.emoji || '🧾')).join('') + (bl.length > 2 ? '+' : '');
    const over = daily > 0 && sp > daily;
    const label = `${d} ${fmtMonth(md)}${pays.includes(d) ? ', payday' : ''}${bl.length ? `, ${bl.length} bill${bl.length === 1 ? '' : 's'}` : ''}${sp ? `, spent ${money(sp)}` : ''}`;
    cells += `<button class="cal-day ${di === todayI ? 'today' : ''} ${di > todayI ? 'future' : ''}" data-act="day" data-v="${di}" aria-label="${esc(label)}">
      <span class="dn">${d}</span><span class="mk" aria-hidden="true">${marks}</span><span class="ds ${over ? 'over' : ''}">${sp ? (over ? '↑' : '') + money(sp, true) : ''}</span></button>`;
  }
  const events = [];
  pays.forEach((d) => events.push({ d, emoji: '💰', name: 'Payday', amount: Number(S.income.amount) || 0 }));
  S.bills.forEach((b) => { const bd = parseInt(b.day, 10); if (bd) events.push({ d: Math.min(bd, n), emoji: b.emoji || '🧾', name: b.name, amount: -(Number(b.amount) || 0) }); });
  events.sort((a, b) => a.d - b.d);
  const billTotal = S.bills.reduce((a, b) => a + (Number(b.amount) || 0), 0);
  const spentTotal = Object.values(spentBy).reduce((a, v) => a + v, 0);
  return `
  <div class="row between" style="margin-bottom:14px">
    <button class="icon-btn" data-act="cal-month" data-d="-1" aria-label="Previous month">${icon('left')}</button>
    <h2 style="font-size:1.15rem">${esc(fmtMonth(md))}</h2>
    <button class="icon-btn" data-act="cal-month" data-d="1" aria-label="Next month">${icon('right')}</button>
  </div>
  <div class="grid two">
    <section class="card">
      <div class="cal-head" aria-hidden="true">${WD.map((w) => `<span>${w.slice(0, 2)}</span>`).join('')}</div>
      <div class="cal">${cells}</div>
      <div class="key"><span>💰 Payday</span><span>🏠 Bill due</span><span style="color:var(--warn-ink);font-weight:700">↑ £ more than your daily budget${daily > 0 ? ` (${esc(money(daily, true))})` : ''}</span></div>
      ${UI.calOffset !== 0 ? `<button class="link-btn" data-act="cal-today" style="margin-top:8px">Back to today</button>` : ''}
    </section>
    <section class="card">
      <div class="card-head"><h2>This month's money dates</h2></div>
      <div class="tiles" style="grid-template-columns:repeat(2,1fr);margin-bottom:10px">
        <div class="tile"><div class="k">Bills</div><div class="v num">${money(billTotal, true)}</div></div>
        <div class="tile"><div class="k">Spent</div><div class="v num">${money(spentTotal, true)}</div></div>
      </div>
      ${events.length ? `<div class="list">${events.map((e) => `<button class="item" data-act="day" data-v="${iso(new Date(y, m, e.d))}"><span class="emoji">${esc(e.emoji)}</span><div class="grow"><div class="title">${esc(e.name)}</div><div class="muted small">${esc(new Date(y, m, e.d).toLocaleDateString(locale(), { weekday: 'short', day: 'numeric', month: 'short' }))}</div></div><span class="amt num ${e.amount > 0 ? 'in' : ''}">${e.amount > 0 ? '+' : ''}${money(Math.abs(e.amount))}</span></button>`).join('')}</div>`
        : '<div class="empty small">Add your payday and bill dates in Settings to see them here.</div>'}
    </section>
  </div>`;

function openDay(d) {

      ${bills.map((b) => `<div class="item"><span class="emoji">${esc(b.emoji || '🧾')}</span><div class="grow"><div class="title">${esc(b.name)}</div><div class="muted small">Bill</div></div><span class="amt num">${money(b.amount)}</span></div>`).join('')}</div>` : ''}
    <div><div class="row between"><h2>Spending</h2><b class="num">${money(spent)}</b></div>

}

/* ---------- Year ---------- */
function viewYear() {
  const now = today(), y = now.getFullYear() + UI.yearOffset, c = calc();
  const curM = y === now.getFullYear() ? now.getMonth() : y < now.getFullYear() ? 11 : -1;
  const M = Array.from({ length: 12 }, (_, i) => ({ i, spent: 0, n: 0, extra: 0, saved: 0, debt: 0 }));
  const catT = {};
  for (const t of S.tx) { const d = parseD(t.date); if (d.getFullYear() !== y) continue; const r = M[d.getMonth()], a = Number(t.amount) || 0; if (t.type === 'in') r.extra += a; else { r.spent += a; r.n++; catT[t.cat] = (catT[t.cat] || 0) + a; } }
  for (const g of S.goals) for (const h of g.history || []) { const d = parseD(h.date); if (d.getFullYear() === y) M[d.getMonth()].saved += Number(h.amount) || 0; }
  for (const db of S.debts) for (const h of db.history || []) { const d = parseD(h.date); if (d.getFullYear() === y) M[d.getMonth()].debt += Number(h.amount) || 0; }
  const has = (r) => r.i <= curM && (r.n > 0 || r.saved !== 0 || r.debt > 0);
  const act = M.filter(has);
  const totS = act.reduce((a, r) => a + r.spent, 0), totSaved = act.reduce((a, r) => a + r.saved, 0), totDebt = act.reduce((a, r) => a + r.debt, 0);
  const full = act.filter((r) => !(y === now.getFullYear() && r.i === curM));
  const avg = full.length ? full.reduce((a, r) => a + r.spent, 0) / full.length : 0;
  const best = full.length ? full.reduce((a, r) => (r.spent < a.spent ? r : a)) : null;
  const budget = c.flexibleMonthly;
  const mName = (i, opt = 'short') => new Date(y, i, 1).toLocaleDateString(locale(), { month: opt });
  // chart
  const W = 340, H = 170, top = 14, bottom = 22, ph = H - top - bottom, colW = W / 12, bw = Math.min(18, colW - 8);
  const max = Math.max(budget > 0 ? budget * 1.15 : 0, ...M.map((r) => r.spent), 1);
  const yv = (v) => top + ph - (v / max) * ph;
  let bars = '';
  M.forEach((r) => {
    const x = r.i * colW + (colW - bw) / 2, h = (r.spent / max) * ph, partial = y === now.getFullYear() && r.i === curM;
    if (r.spent > 0) { const rr = Math.min(4, h / 2); bars += `<path d="M${x},${top + ph} V${top + ph - h + rr} Q${x},${top + ph - h} ${x + rr},${top + ph - h} H${x + bw - rr} Q${x + bw},${top + ph - h} ${x + bw},${top + ph - h + rr} V${top + ph} Z" fill="var(--accent)" ${partial ? 'opacity=".5"' : ''}/>`; }
    const tip = r.i > curM ? `${mName(r.i, 'long')}: not yet` : `${mName(r.i, 'long')}: spent ${money(r.spent, true)}${partial ? ' so far' : ''}${r.saved ? `, saved ${money(r.saved, true)}` : ''}`;
    bars += `<rect x="${r.i * colW}" y="${top}" width="${colW}" height="${ph + bottom}" fill="transparent" data-tip="${esc(tip)}" tabindex="0" aria-label="${esc(tip)}"/>`;
    bars += `<text x="${r.i * colW + colW / 2}" y="${H - 5}" text-anchor="middle" class="${partial ? 'today-lbl' : ''}">${esc(mName(r.i, 'narrow'))}</text>`;
  });
  const ref = budget > 0 ? `<line x1="0" x2="${W}" y1="${yv(budget)}" y2="${yv(budget)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>` : '';
  const cats = Object.entries(catT).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const cmax = cats.length ? cats[0][1] : 1;
  const rowsHtml = act.slice().reverse().map((r) => {
    const partial = y === now.getFullYear() && r.i === curM; const diff = budget - r.spent;
    const vs = partial ? '<span class="muted small">so far</span>' : budget <= 0 ? '' : diff >= 0 ? `<span class="pill good">✓ ${money(diff, true)} under</span>` : `<span class="pill bad">⚠ ${money(-diff, true)} over</span>`;
    return `<tr><td><b>${esc(mName(r.i, 'long'))}</b></td><td>${money(r.spent, true)}</td><td>${money(r.saved, true)}</td><td>${vs}</td></tr>`;
  }).join('');
  return `
  <div class="row between" style="margin-bottom:14px">
    <button class="icon-btn" data-act="year" data-d="-1" aria-label="Previous year">${icon('left')}</button>
    <h2 style="font-size:1.15rem">${y}</h2>
    <button class="icon-btn" data-act="year" data-d="1" aria-label="Next year" ${UI.yearOffset >= 0 ? 'disabled style="opacity:.35"' : ''}>${icon('right')}</button>
  </div>
  <div class="tiles" style="margin-bottom:14px">
    <div class="tile"><div class="k">Spent</div><div class="v num">${money(totS, true)}</div></div>
    <div class="tile"><div class="k">Saved</div><div class="v num">${money(totSaved, true)}</div></div>
    <div class="tile"><div class="k">${totDebt > 0 ? 'Debt paid' : 'Avg month'}</div><div class="v num">${money(totDebt > 0 ? totDebt : avg, true)}</div></div>
  </div>
  ${act.length ? `<div class="grid two">
    <div class="stack">
      <section class="card chart">
        <div class="card-head"><h2>Spending each month</h2>${budget > 0 ? `<span class="muted small row" style="gap:6px;white-space:nowrap"><svg width="18" height="4" aria-hidden="true"><line x1="0" x2="18" y1="2" y2="2" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"/></svg>Plan ${money(budget, true)}</span>` : ''}</div>
        <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Spending each month in ${y}"><line x1="0" x2="${W}" y1="${top + ph}" y2="${top + ph}" stroke="var(--grid)"/>${ref}${bars}</svg>

function viewDebts() {

  const paid = Math.max(0, start - owed), p = start > 0 ? paid / start : 0;

        <div class="row wrap">${[0, 25, 50, 100].map((v) => `<button class="chip" data-act="debt-extra" data-v="${v}" aria-pressed="${extra === v}">${v ? '+' + money(v, true) : 'None'}</button>`).join('')}</div></div>

function saveDebt() {
