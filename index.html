$('#importFile').addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const parsed = JSON.parse(r.result); const data = parsed && parsed.data ? parsed.data : parsed;
      if (!data || typeof data !== 'object' || !('income' in data)) throw new Error('bad');
      S = migrate(data); save(); UI.tab = 'home'; render(); toast('Backup loaded ✓');
    } catch (err) { toast('That file isn\'t a backup from this app.'); }
    e.target.value = '';
  };
  r.readAsText(f);
});

function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function demoState() {
  const s = freshState(); const r = rng(42); const t = today();
  s.setupDone = true; s.demo = true; s.profile.name = 'Sam';
  s.settings = { ...S.settings };
  const payday = new Date(t.getFullYear(), t.getMonth(), 28); if (payday < t) payday.setMonth(payday.getMonth() + 1);
  s.income = { amount: 2450, freq: 'monthly', nextPayday: iso(payday) };
  const bills = [['Rent', '🏠', 750, 1], ['Council tax', '🏛️', 125, 1], ['Energy', '⚡', 95, 5], ['Phone', '📱', 22, 12], ['Internet', '🌐', 30, 18], ['Netflix', '📺', 10.99, 20], ['Spotify', '🎵', 11.99, 22], ['Gym', '💪', 28, 3]];
  s.bills = bills.map(([name, emoji, amount, day]) => ({ id: uid(), name, emoji, amount, day: ((day + t.getDate()) % 28) + 1 }));
  // history runs from 1 January (at least 90 days back)
  const startD = new Date(Math.min(new Date(t.getFullYear(), 0, 1), addDays(t, -90)));
  const monthsBack = [];
  for (let d = new Date(startD.getFullYear(), startD.getMonth(), 1); d <= t; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) monthsBack.push(d);
  const hist = (day, amount) => monthsBack.map((m) => new Date(m.getFullYear(), m.getMonth(), day)).filter((d) => d <= t && d >= startD).map((d) => ({ date: iso(d), amount }));
  const by = new Date(t.getFullYear() + (t.getMonth() >= 5 ? 1 : 0), 5, 1);
  const hh = hist(28, 90), rh = hist(28, 60);
  s.goals = [
    { id: uid(), name: 'Holiday', emoji: '🏖️', target: 2000, saved: hh.reduce((a, h) => a + h.amount, 0), monthly: 90, by: iso(by), history: hh },
    { id: uid(), name: 'Rainy-day fund', emoji: '🛟', target: 1000, saved: rh.reduce((a, h) => a + h.amount, 0), monthly: 60, by: '', history: rh },
  ];
  const ch = hist(15, 80), lh = hist(15, 165);
  s.debts = [
    { id: uid(), name: 'Credit card', emoji: '💳', startBalance: 2600, balance: Math.max(400, 2600 - ch.reduce((a, h) => a + h.amount, 0) * 0.8), apr: 22.9, minPay: 55, history: ch },
    { id: uid(), name: 'Car loan', emoji: '🚗', startBalance: 6000, balance: Math.max(900, 6000 - lh.reduce((a, h) => a + h.amount, 0) * 0.85), apr: 6.9, minPay: 165, history: lh },
  ];
  s.debts.forEach((d) => { d.balance = Math.round(d.balance * 100) / 100; });
  s.debtPlan = { strategy: 'avalanche', extra: 25 };
  s.limits = { groceries: 280, eatingout: 90, coffee: 50, fun: 60 };
  const plan = [
    ['groceries', 0.28, 15, 45, ['Tesco', 'Aldi', 'Sainsbury\'s', '']],
    ['coffee', 0.45, 2.8, 4.2, ['Costa', 'Greggs', '', 'Meal deal']],
    ['eatingout', 0.16, 9, 26, ['Takeaway', 'Nando\'s', 'Pizza', '']],
    ['transport', 0.35, 3, 12, ['Bus', 'Fuel', 'Train', '']],
    ['shopping', 0.07, 12, 40, ['Clothes', 'Amazon', '']],
    ['fun', 0.08, 8, 30, ['Cinema', 'Drinks', 'Bowling']],
    ['home', 0.08, 5, 20, ['Cleaning stuff', '']],
    ['health', 0.06, 4, 15, ['Boots', '']],
    ['gifts', 0.02, 10, 40, ['Birthday present', '']],
  ];
  const span = dayDiff(startD, t);
  for (let i = span; i >= 0; i--) {
    const d = iso(addDays(t, -i));
    for (const [cat, p, lo, hi, notes] of plan) {
      if (r() < p * (i === 0 ? 0.5 : 1)) s.tx.push({ id: uid(), type: 'spend', cat, amount: Math.round((lo + r() * (hi - lo)) * 100) / 100, date: d, note: notes[Math.floor(r() * notes.length)], created: Date.now() - i * 864e5 });
    }
  }
  s.tx.push({ id: uid(), type: 'in', cat: 'sold', amount: 35, date: iso(addDays(t, -9)), note: 'Old trainers', created: Date.now() });
  return s;
}

/* ===================== Tooltip / toast / confetti ===================== */
const tipEl = $('#tip');
function showTip(el) {
  const text = el.getAttribute('data-tip'); if (!text) return;
  tipEl.textContent = text; tipEl.classList.add('show');
  const r = el.getBoundingClientRect();
  const x = clamp(r.left + r.width / 2, 70, innerWidth - 70);
  tipEl.style.left = `${x}px`; tipEl.style.top = `${Math.max(8, r.top - 36)}px`;
}
function hideTip() { tipEl.classList.remove('show'); }
document.addEventListener('pointerover', (e) => { const el = e.target.closest('[data-tip]'); if (el) showTip(el); });
document.addEventListener('pointerout', (e) => { if (e.target.closest('[data-tip]')) hideTip(); });
document.addEventListener('focusin', (e) => { const el = e.target.closest('[data-tip]'); if (el) showTip(el); });
document.addEventListener('focusout', hideTip);
addEventListener('scroll', hideTip, { passive: true });

let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600); }
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas'); c.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:80'; c.width = innerWidth; c.height = innerHeight; document.body.appendChild(c);
  const x = c.getContext('2d'); const cols = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#6250d6'];
  const P = Array.from({ length: 120 }, () => ({ x: innerWidth / 2, y: innerHeight / 3, vx: (Math.random() - 0.5) * 12, vy: Math.random() * -12 - 3, s: 4 + Math.random() * 5, c: cols[(Math.random() * cols.length) | 0], r: Math.random() * 6 }));
  let f = 0; (function tick() { x.clearRect(0, 0, c.width, c.height); P.forEach((p) => { p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.r += 0.1; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6); x.restore(); }); if (f++ < 110) requestAnimationFrame(tick); else c.remove(); })();
}

/* ===================== Events ===================== */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, v = el.dataset.v, id = el.dataset.id;
  const press = (sel, val) => $$(sel, sheetRoot).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === val)));
  switch (act) {
    case 'tab': UI.tab = el.dataset.tab; if (UI.tab === 'spending') UI.monthOffset = 0; render(); window.scrollTo(0, 0); break;
    case 'add': openAdd(); break;
    case 'close-sheet': closeSheet(); break;
    case 'month': UI.monthOffset = Math.min(0, UI.monthOffset + Number(el.dataset.d)); render(); break;
    // add / edit transaction
    case 'tx-type': {
      const keep = { amount: $('#tx-amount').value, note: $('#tx-note').value, date: $('#tx-date').value };
      UI.sheet.type = v; UI.sheet.cat = null; UI.sheet.date = keep.date || UI.sheet.date;
      const sh = $('.sheet', sheetRoot); const tx = UI.sheet.id ? S.tx.find((x) => x.id === UI.sheet.id) : null;
      sh.innerHTML = addSheetHtml(tx); $('#tx-amount').value = keep.amount; $('#tx-note').value = keep.note; break;
    }
    case 'tx-cat': UI.sheet.cat = v; press('[data-act="tx-cat"]', v); $('#tx-err').textContent = ''; break;
    case 'tx-date': UI.sheet.date = v; $('#tx-date').value = v; press('[data-act="tx-date"]', v); break;
    case 'tx-save': saveTx(); break;
    case 'tx-edit': { const t = S.tx.find((x) => x.id === id); if (t) openAdd(t); break; }
    case 'tx-delete': S.tx = S.tx.filter((x) => x.id !== UI.sheet.id); save(); closeSheet(); render(); toast('Deleted'); break;
    // views
    case 'spend-view': UI.spendView = v; render(); break;
    case 'goals-view': UI.goalsView = v; render(); break;
    case 'cal-month': UI.calOffset = clamp(UI.calOffset + Number(el.dataset.d), -36, 12); render(); break;
    case 'cal-today': UI.calOffset = 0; render(); break;
    case 'year': UI.yearOffset = Math.min(0, UI.yearOffset + Number(el.dataset.d)); render(); break;
    case 'day': openDay(v); break;
    case 'add-on': openAdd(null, v); break;
    // debts
    case 'debt-new': openDebt(); break;
    case 'debt-edit': openDebt(S.debts.find((x) => x.id === id)); break;
    case 'd-emoji': UI.sheet.emoji = v; press('[data-act="d-emoji"]', v); break;
    case 'd-save': saveDebt(); break;
    case 'd-delete': { const did = UI.sheet.id; askConfirm('Delete this debt?', 'It will be removed from your plan.', 'Delete debt', () => { S.debts = S.debts.filter((x) => x.id !== did); save(); render(); toast('Debt deleted'); }); break; }
    case 'debt-pay': openDebtPay(S.debts.find((x) => x.id === id)); break;
    case 'dp-save': payDebt(); break;
    case 'debt-strategy': S.debtPlan.strategy = v; save(); render(); break;
    case 'debt-extra': S.debtPlan.extra = Number(v); save(); render(); break;
    // limits
    case 'limit': openLimit(v); break;
    case 'limit-pick': openLimitPick(); break;
    case 'l-quick': $('#l-amount').value = v; break;
    case 'l-save': { const a = num($('#l-amount').value), lid = UI.sheet.id; if (a <= 0) { $('#l-err').textContent = 'Type a monthly amount, or tap Remove limit.'; break; } S.limits[lid] = a; save(); closeSheet(); render(); toast(`${catById(lid).emoji} Limit set: ${money(a, true)} a month`); break; }
    case 'l-remove': delete S.limits[UI.sheet.id]; save(); closeSheet(); render(); toast('Limit removed'); break;
    // goals
    case 'goal-new': openGoal(); break;
    case 'goal-edit': openGoal(S.goals.find((x) => x.id === id)); break;
    case 'goal-suggest': $('#g-name').value = v; UI.sheet.emoji = el.dataset.e; press('[data-act="goal-emoji"]', el.dataset.e); break;
    case 'goal-emoji': UI.sheet.emoji = v; press('[data-act="goal-emoji"]', v); break;
    case 'goal-save': saveGoal(); break;
    case 'goal-delete': { const gid = UI.sheet.id; askConfirm('Delete this goal?', 'The goal and the money tracked in it will be removed.', 'Delete goal', () => { S.goals = S.goals.filter((x) => x.id !== gid); save(); render(); toast('Goal deleted'); }); break; }
    case 'confirm-ok': { const f = confirmAction; confirmAction = null; closeSheet(); if (f) f(); break; }
    case 'goal-add': openGoalAdd(S.goals.find((x) => x.id === id)); break;
    case 'ga-quick': { const a = $('#ga-amount'); a.value = (num(a.value) + Number(v)).toFixed(2).replace(/\.00$/, ''); break; }
    case 'ga-save': goalMove(1); break;
    case 'ga-take': goalMove(-1); break;
    // bills & income
    case 'bill-new': openBill(); break;
    case 'bill-edit': openBill(S.bills.find((x) => x.id === id)); break;
    case 'bill-suggest': $('#b-name').value = v; $('#b-emoji').value = el.dataset.e; $('#b-amount').focus(); break;
    case 'bill-save': saveBill(); break;
    case 'bill-delete': S.bills = S.bills.filter((x) => x.id !== UI.sheet.id); save(); closeSheet(); render(); toast('Bill deleted'); break;
    case 'income-edit': openIncome(); break;
    case 'i-freq': UI.sheet.freq = v; press('[data-act="i-freq"]', v); break;
    case 'i-save': S.income = { amount: num($('#i-amount').value), freq: UI.sheet.freq, nextPayday: $('#i-payday').value || '' }; save(); closeSheet(); render(); toast('Saved ✓'); break;
    // categories
    case 'cat-new': openCat(); break;
    case 'c-emoji': UI.sheet.emoji = v; press('[data-act="c-emoji"]', v); break;
    case 'c-kind': UI.sheet.kindOf = v; press('[data-act="c-kind"]', v); break;
    case 'c-save': { const name = $('#c-name').value.trim(); if (!name) { $('#c-err').textContent = 'Give it a name.'; break; } const ce = UI.sheet.emoji; S.customCats.push({ id: 'c_' + uid(), name, emoji: ce, kind: UI.sheet.kindOf }); save(); closeSheet(); render(); toast(`${ce} ${name} added`); break; }
    case 'cat-del': { const c = S.customCats.find((x) => x.id === id); if (c) askConfirm(`Remove ${esc(c.emoji)} ${esc(c.name)}?`, 'Anything you added to it will show as Other.', 'Remove', () => { S.customCats = S.customCats.filter((x) => x.id !== id); save(); render(); toast('Category removed'); }); break; }
    // look
    case 'theme': S.settings.theme = v; save(); render(); break;
    case 'accent': S.settings.accent = v; save(); render(); break;
    // data
    case 'export': exportData(); break;
    case 'import': $('#importFile').click(); break;
    case 'demo': {
      const load = () => { S = demoState(); save(); UI.tab = 'home'; UI.ob = null; render(); window.scrollTo(0, 0); toast('Example data loaded 👀'); };
      if (S.setupDone && !S.demo) askConfirm('Load example data?', 'This replaces what you have now. Download a backup first if you want to keep it.', 'Load example data', load);
      else load();
      break;
    }
    case 'start-fresh': case 'reset': {
      const wipe = () => { const keep = { ...S.settings }; S = freshState(); S.settings = keep; save(); UI.ob = null; UI.tab = 'home'; render(); window.scrollTo(0, 0); };
      if (act === 'reset') askConfirm('Delete everything?', 'This can\'t be undone. Download a backup first if you want to keep your data.', 'Delete everything', wipe);
      else askConfirm('Set up your own?', 'This clears the example data so you can start with your own numbers.', 'Clear example data', wipe, false);
      break;
    }
    // onboarding
    case 'ob-next': obNext(); break;
    case 'ob-back': harvestOb(); UI.ob.step = Math.max(0, UI.ob.step - 1); renderOnboarding(); break;
    case 'ob-freq': harvestOb(); UI.ob.freq = v; renderOnboarding(); break;
    case 'ob-bill': {
      harvestOb(); const o = UI.ob;
      if (o.bills[v]) delete o.bills[v]; else { const b = CONFIG.billSuggestions.find((x) => x.name === v); o.bills[v] = { emoji: b ? b.emoji : '🧾', amount: '', day: '' }; }
      renderOnboarding(); const inp = document.querySelector(`[data-bill-amt="${CSS.escape(v)}"]`); if (inp) inp.focus(); break;
    }
    case 'ob-goal': {
      harvestOb(); const o = UI.ob; const g = CONFIG.goalSuggestions.find((x) => x.name === v);
      o.goal = o.goal && o.goal.key === v ? null : { key: v, name: v, emoji: g ? g.emoji : '🎯' };
      renderOnboarding(); break;
    }
    case 'ob-finish': S.setupDone = true; S.demo = false; save(); UI.ob = null; UI.tab = 'home'; render(); window.scrollTo(0, 0); toast('All set! 🎉'); break;
  }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'set-currency') { S.settings.currency = e.target.value; save(); render(); }
  if (e.target.id === 'debt-extra') { S.debtPlan.extra = num(e.target.value); save(); render(); }
  if (e.target.id === 'set-name') { S.profile.name = e.target.value.trim(); save(); toast('Saved ✓'); }
  if (e.target.id === 'tx-date' && UI.sheet) { UI.sheet.date = e.target.value; $$('[data-act="tx-date"]', sheetRoot).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === e.target.value))); }
  if (e.target.id === 'ob-currency') { S.settings.currency = e.target.value; }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !sheetRoot.hidden) closeSheet();
  if (e.key === 'Enter' && UI.sheet && e.target.tagName === 'INPUT') {
    const map = { tx: 'tx-save', goal: 'goal-save', 'goal-add': 'ga-save', bill: 'bill-save', income: 'i-save', cat: 'c-save', debt: 'd-save', 'debt-pay': 'dp-save', limit: 'l-save' };
    const btn = sheetRoot.querySelector(`[data-act="${map[UI.sheet.kind]}"]`); if (btn) { e.preventDefault(); btn.click(); }
  }
  if (e.key === 'Enter' && UI.ob && !S.setupDone && e.target.tagName === 'INPUT') { e.preventDefault(); obNext(); }
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.settings.theme === 'auto') applyTheme(); });
addEventListener('storage', (e) => { if (e.key === STORE_KEY) { S = loadState(); render(); } });

render();

try {
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
} catch (e) { /* not allowed here: the app still works, just without offline caching */ }
</script>
